[package]
name = "heart-portal"
version = "0.8.3"
edition = "2021"
description = "Portal — Being's gateway to the world. Lightweight MCP server with built-in tools."

[[bin]]
name = "heart-portal"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json", "gzip"] }
regex = "1"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22.1"
sha2 = "0.10"
subtle = "2"
open = "5"
rand = "0.9"
hostname = "0.4"
socket2 = "0.5"
url = "2"
clap = { version = "4", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
# Local HTTP receiver used by background-task callback tests.
axum = "0.8"
