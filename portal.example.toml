# New installations keep this file at ~/.heart-portal/portal.toml.
# Existing explicit/saved configs are preserved. Use `heart-portal config path`
# to see the effective path and `config migrate --from ...` to preview migration.
# This file can contain credentials; keep it private and out of source control.
name = "portal"
# Optional persistent Being link. --connect and PORTAL_CONNECT_LINK override it.
# connect = "https://your-hearth/your-being/?token=YOUR_TOKEN"
# Relative to this config file, not the shell's current directory.
# Windows absolute path example: workspace = 'C:\Users\you\Portal Workspace'
workspace = "./workspace"
bind = "127.0.0.1:9100"
kits_enabled = true

# By default kits are loaded from ~/.heart-portal/kits, including
# %USERPROFILE%/.heart-portal/kits on Windows.
# kits_dir = "C:/Users/you/.heart-portal/kits"

[tools]
exec = true
file = true
screenshot = true
web_fetch = true
search = true
custom_tools_enabled = true

[security]
# Standalone releases use full host access. Town-Client overrides this with
# --permission-mode according to the user's saved approval policy.
permission_mode = "full-access"
# An empty allowlist permits any portal_exec command. Set this list when the
# connected Being should be restricted to specific executables.
exec_allowlist = []
max_file_size = 10485760
